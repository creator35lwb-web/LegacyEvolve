name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-lep-sdk:
    name: Test LEP Python SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29  # v4.1.1 pinned to SHA
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d  # v5.0.0 pinned to SHA
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          # Install LEP SDK dependencies (add requirements.txt if exists)
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run LEP adapter tests
        run: |
          echo "Running LEP SDK adapter tests..."
          cd src && python -m pytest test_adapter.py -v --tb=short || python test_adapter.py
        continue-on-error: false

      - name: Run LEP MCP bridge tests
        run: |
          echo "Running LEP MCP bridge tests..."
          cd src && python test_mcp_bridge.py
        continue-on-error: false
      
      - name: Test summary
        if: always()
        run: |
          echo "## Test Results (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Unit tests completed" >> $GITHUB_STEP_SUMMARY

  test-cobol-adapter:
    name: Test COBOL Adapter
    runs-on: ubuntu-latest
    needs: test-lep-sdk
    
    steps:
