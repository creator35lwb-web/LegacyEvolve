name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scans every Sunday at midnight

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29  # v4.1.1 pinned to SHA
      
      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d  # v5.0.0 pinned to SHA
        with:
          python-version: '3.12'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pipenv
      
      - name: Run Bandit (SAST - Static Application Security Testing)
        run: |
          echo "Running Bandit security analysis..."
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -ll  # Show only medium and high severity issues
        continue-on-error: true
      
      - name: Run Safety (SCA - Software Composition Analysis)
        run: |
          echo "Running Safety dependency vulnerability scan..."
          safety check --full-report --json > safety-report.json || true
          safety check --full-report
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3  # v4.3.1 pinned to SHA
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 90
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1b1aada464948af03b950897e5eb522f92603cc2  # v3.24.9 pinned to SHA
        with:
          languages: python
          queries: security-and-quality
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1b1aada464948af03b950897e5eb522f92603cc2  # v3.24.9 pinned to SHA
        with:
          category: "/language:python"
      
      - name: Security scan summary
        if: always()
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Bandit (SAST): Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Safety (SCA): Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ CodeQL: Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Detailed reports available in artifacts" >> $GITHUB_STEP_SUMMARY
